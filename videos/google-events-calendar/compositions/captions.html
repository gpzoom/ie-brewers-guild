        <div data-hf-id="hf-898y" class="cap" id="cap-000">Your events can show up on the Guild homepage.</div>
        <div data-hf-id="hf-8ork" class="cap" id="cap-001">And it happens on its own.</div>
        <div data-hf-id="hf-l3rj" class="cap" id="cap-002">Here's how to set it up with Google Calendar.</div>
        <div data-hf-id="hf-wpse" class="cap" id="cap-003">It takes three steps.</div>
        <div data-hf-id="hf-6uwv" class="cap" id="cap-004">Make an events calendar.</div>
        <div data-hf-id="hf-txfe" class="cap" id="cap-005">Tag your events.</div>
        <div data-hf-id="hf-0geh" class="cap" id="cap-006">Then paste one link.</div>
        <div data-hf-id="hf-mixu" class="cap" id="cap-007">Start with a new calendar just for your events.</div>
        <div data-hf-id="hf-dyk3" class="cap" id="cap-008">Anyone with its link can see everything on it.</div>
        <div data-hf-id="hf-tuv6" class="cap" id="cap-009">So keep it separate from your own calendar.</div>
        <div data-hf-id="hf-gaqp" class="cap" id="cap-010">In Google Calendar press the plus next to Other calendars.</div>
        <div data-hf-id="hf-vvms" class="cap" id="cap-011">Choose Create new calendar.</div>
        <div data-hf-id="hf-tr4e" class="cap" id="cap-012">Name it and press Create calendar.</div>
        <div data-hf-id="hf-s2qg" class="cap" id="cap-013">Now point at the new calendar's name</div>
        <div data-hf-id="hf-phwj" class="cap" id="cap-014">and open Settings and sharing.</div>
        <div data-hf-id="hf-9ql9" class="cap" id="cap-015">Under Access permissions for events tick Make available to public.</div>
        <div data-hf-id="hf-1zvj" class="cap" id="cap-016">Right next to it is a menu.</div>
        <div data-hf-id="hf-ci39" class="cap" id="cap-017">Change See only free/busy to See all event details.</div>
        <div data-hf-id="hf-6yp6" class="cap" id="cap-018">This one matters.</div>
        <div data-hf-id="hf-wcq3" class="cap" id="cap-019">Without it Google hides your event names and nothing comes through.</div>
        <div data-hf-id="hf-esu8" class="cap" id="cap-020">Now scroll down to Integrate calendar.</div>
        <div data-hf-id="hf-ke62" class="cap" id="cap-021">Copy the Public address in iCal format.</div>
        <div data-hf-id="hf-653p" class="cap" id="cap-022">Step two.</div>
        <div data-hf-id="hf-8f3w" class="cap" id="cap-023">Add your events to this calendar.</div>
        <div data-hf-id="hf-lkxy" class="cap" id="cap-024">Type #guild in each event's title or description.</div>
        <div data-hf-id="hf-8x30" class="cap" id="cap-025">Only tagged events come through.</div>
        <div data-hf-id="hf-uvln" class="cap" id="cap-026">Step three.</div>
        <div data-hf-id="hf-6a5s" class="cap" id="cap-027">Sign in to the Member Portal and open Events.</div>
        <div data-hf-id="hf-mqkd" class="cap" id="cap-028">Press Add calendar.</div>
        <div data-hf-id="hf-5klo" class="cap" id="cap-029">Paste your link and type the same tag.</div>
        <div data-hf-id="hf-tt47" class="cap" id="cap-030">Then press Refresh now.</div>
        <div data-hf-id="hf-1wm2" class="cap" id="cap-031">Your events show up on your profile right away.</div>
        <div data-hf-id="hf-zokr" class="cap" id="cap-032">With the time and the place and your description.</div>
        <div data-hf-id="hf-e01c" class="cap" id="cap-033">Events in the next two weeks</div>
        <div data-hf-id="hf-2p4n" class="cap" id="cap-034">also appear on the Guild homepage.</div>
        <div data-hf-id="hf-xmua" class="cap" id="cap-035">Each one gets its own calendar page</div>
        <div data-hf-id="hf-gltn" class="cap" id="cap-036">with your logo and your color.</div>
        <div data-hf-id="hf-kn0k" class="cap" id="cap-037">From now on just add events to that calendar.</div>
        <div data-hf-id="hf-qbxm" class="cap" id="cap-038">The site checks for changes on its own.</div>
        <div data-hf-id="hf-zw21" class="cap" id="cap-039">Google can take a few hours</div>
        <div data-hf-id="hf-6zul" class="cap" id="cap-040">to update so give it a little time.</div>
        <div data-hf-id="hf-j64g" class="cap" id="cap-041">Need help?</div>
