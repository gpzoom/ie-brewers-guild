       <div class="band">
        <div class="cap" id="cap-000">Welcome.</div>
        <div class="cap" id="cap-001">This video shows you how to send email from your guild address,</div>
        <div class="cap" id="cap-002">like president@iscbrewersguild.org, right from the guild Gmail account.</div>
        <div class="cap" id="cap-003">Mail sent to your guild address already arrives in that inbox.</div>
        <div class="cap" id="cap-004">Today we add the sending side.</div>
        <div class="cap" id="cap-005">It takes about five minutes, and you only do it once.</div>
        <div class="cap" id="cap-006">You'll need three things.</div>
        <div class="cap" id="cap-007">A computer, because the Gmail phone app can't do this step.</div>
        <div class="cap" id="cap-008">The guild Gmail account, signed in.</div>
        <div class="cap" id="cap-009">And the sending password the webmaster gave you,</div>
        <div class="cap" id="cap-010">by phone or in person.</div>
        <div class="cap" id="cap-011">Keep that password private, and never email it.</div>
        <div class="cap" id="cap-012">Step one.</div>
        <div class="cap" id="cap-013">Open Gmail and check the picture at the top right.</div>
        <div class="cap" id="cap-014">It must be the guild account, not your personal one.</div>
        <div class="cap" id="cap-015">Click the gear icon, then See all settings.</div>
        <div class="cap" id="cap-016">Open the Accounts and Import tab.</div>
        <div class="cap" id="cap-017">Find Send mail as, and click Add another email address.</div>
        <div class="cap" id="cap-018">Step two.</div>
        <div class="cap" id="cap-019">A small window opens.</div>
        <div class="cap" id="cap-020">If it doesn't, your browser blocked the pop-up,</div>
        <div class="cap" id="cap-021">so allow pop-ups for Gmail and click again.</div>
        <div class="cap" id="cap-022">Type the name people will see,</div>
        <div class="cap" id="cap-023">like ISC Brewers Guild President, and your guild address.</div>
        <div class="cap" id="cap-024">Leave Treat as an alias checked, and click Next Step.</div>
        <div class="cap" id="cap-025">Step three, the server settings.</div>
        <div class="cap" id="cap-026">Type them exactly.</div>
        <div class="cap" id="cap-027">The SMTP server is smtp.resend.com.</div>
        <div class="cap" id="cap-028">Pick port 465.</div>
        <div class="cap" id="cap-029">The username is just the word resend.</div>
        <div class="cap" id="cap-030">For the password, paste the sending password from the webmaster.</div>
        <div class="cap" id="cap-031">Choose Secured connection using SSL, then click Add Account.</div>
        <div class="cap" id="cap-032">Step four.</div>
        <div class="cap" id="cap-033">Gmail sends a confirmation email to your guild address,</div>
        <div class="cap" id="cap-034">and it arrives right back in this same inbox.</div>
        <div class="cap" id="cap-035">Open it and click the link.</div>
        <div class="cap" id="cap-036">Nothing after a couple of minutes?</div>
        <div class="cap" id="cap-037">Check your Spam folder.</div>
        <div class="cap" id="cap-038">One last setting.</div>
        <div class="cap" id="cap-039">Back on Accounts and Import, find When replying to a message,</div>
        <div class="cap" id="cap-040">and choose Reply from the same address the message was sent to.</div>
        <div class="cap" id="cap-041">Now when someone writes to your guild address, your reply goes out</div>
        <div class="cap" id="cap-042">from it too.</div>
        <div class="cap" id="cap-043">Let's test it.</div>
        <div class="cap" id="cap-044">Click Compose, click the From line, and pick your guild address.</div>
        <div class="cap" id="cap-045">Send a test to your personal email.</div>
        <div class="cap" id="cap-046">There it is, from the guild address.</div>
        <div class="cap" id="cap-047">You're all set, and you never need to do this again.</div>
        <div class="cap" id="cap-048">A few ground rules.</div>
        <div class="cap" id="cap-049">Check the From line before every send.</div>
        <div class="cap" id="cap-050">No mass mailings.</div>
        <div class="cap" id="cap-051">The guild can send 100 emails</div>
        <div class="cap" id="cap-052">a day in total, shared with the website.</div>
        <div class="cap" id="cap-053">Use it for guild business only,</div>
        <div class="cap" id="cap-054">since the inbox passes to the next officer.</div>
        <div class="cap" id="cap-055">And never share either password by email or text.</div>
        <div class="cap" id="cap-056">That's it.</div>
        <div class="cap" id="cap-057">The written guide has every setting and a troubleshooting list.</div>
        <div class="cap" id="cap-058">If you get stuck, send an email to</div>
        <div class="cap" id="cap-059">webmaster@iscbrewersguild.org.</div>
        <div class="cap" id="cap-060">Thanks for serving the guild.</div>
